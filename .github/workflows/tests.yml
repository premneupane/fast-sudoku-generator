name: Tests

on:
  push:
    branches: [main, scripts]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep the downloaded band table in one place so it can be cached between runs.
  FAST_SUDOKU_DATA_DIR: ${{ github.workspace }}/.fast-sudoku-data

jobs:
  lint:
    name: Lint and format (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      # Same hooks as the local pre-commit setup. pytest is skipped here because the
      # test job below runs it on every supported Python version.
      - run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: pytest

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The code uses int.bit_count(), so 3.10 is the oldest supported version.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      # The band table is downloaded from Frazer Jarvis's site at most once per cache key.
      - uses: actions/cache@v6
        with:
          path: .fast-sudoku-data/v36288.txt
          key: band-table-3f1868fb77647e33
      - run: uv run fast-sudoku fetch-data
      - run: uv run pytest

  package:
    name: Build and smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - name: Check what the wheel contains
        run: |
          unzip -l dist/*.whl
          unzip -l dist/*.whl | grep -q "fast_sudoku_generator/cli.py"
          if unzip -l dist/*.whl | grep -q "v36288"; then echo "band table must not be bundled"; exit 1; fi
      - name: Install the wheel in a clean environment and run it
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean dist/*.whl
          /tmp/clean/bin/fast-sudoku --version
          /tmp/clean/bin/fast-sudoku generate -n 3 --seed 1
          /tmp/clean/bin/python -c "import fast_sudoku_generator as f; print(f.generate_grids(2).shape)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
