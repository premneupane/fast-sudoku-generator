name: Publish

# Publishing uses PyPI Trusted Publishing: no API tokens are stored in the repo.
# One-time setup on pypi.org and test.pypi.org: add a "pending publisher" with
#   PyPI project name: nby9
#   owner: nby9   repository: fast-training-data-generator
#   workflow: publish.yml   environment: pypi (PyPI) / testpypi (TestPyPI)
#
# - Run this workflow by hand (Actions tab) to publish to TestPyPI.
# - Publish a GitHub release tagged vX.Y.Z to publish to PyPI.
#   Releases of the scripts line (tags scripts-v*) are ignored.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(uv version --short)
          if [ "v$version" != "${{ github.event.release.tag_name }}" ]; then
            echo "Tag ${{ github.event.release.tag_name }} does not match pyproject version $version"
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/nby9
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false  # no checkout here, so there is no uv.lock to key a cache on
      - run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nby9
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false  # no checkout here, so there is no uv.lock to key a cache on
      - run: uv publish --trusted-publishing always
